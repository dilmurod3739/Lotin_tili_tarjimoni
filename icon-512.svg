<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing circle ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Medical Cross Base -->
  <g filter="url(#glow)">
    <rect x="220" y="120" width="72" height="272" rx="24" fill="url(#emeraldGrad)"/>
    <rect x="120" y="220" width="272" height="72" rx="24" fill="url(#emeraldGrad)"/>
  </g>
  
  <!-- Center Rx Emblem -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="#34d399" stroke-width="6"/>
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#38bdf8" text-anchor="middle" font-style="italic">Rx</text>
  
  <!-- Accents -->
  <circle cx="256" cy="76" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="436" r="10" fill="#38bdf8"/>
</svg>
