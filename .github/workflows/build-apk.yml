name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build MedLatin Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install pillow

      - name: Prepare Assets & Initialize Capacitor
        run: |
          mkdir -p www
          cp index.html style.css app.js data.js icon-192.svg icon-512.svg icon-192.png icon-512.png icon.png manifest.json sw.js www/
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 @capacitor/assets@latest
          npx cap init "MedLatin" "uz.dilmurod.medlatin" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Generate Capacitor Base Assets
        run: |
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a' || true

      - name: Configure Custom Android Launcher Icons & Adaptive Icons
        run: |
          python3 scripts/generate_android_icons.py

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MedLatin.apk
          echo "APK successfully generated at release-output/MedLatin.apk"
          ls -lh release-output/MedLatin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedLatin-Android-APK
          path: release-output/MedLatin.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "MedLatin v1.3.0 (Android APK - Yangilangan Ikonka)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 MedLatin v1.3.0 — Yangilangan Rasmiy Android APK

            ✨ **Ushbu versiyadagi yangiliklar:**
            - 🎨 **Yangi 3D Tibbiy Ilova Ikonkasi:** Telefoningiz ekranida zumrad-yashil va tilla rang Rx belgili jozibador 3D ikonka bilan o'rnatiladi.
            - 🚀 **Android Splash Screen:** Ilova ochilganda maxsus qora-zumrad fonli yuklanish ekrani.
            - 📱 **Qulay Mobil Navigatsiya:** Ortiqcha panellarsiz qulay pastki menyu.
            - 🩺 **200+ Klinik Tashxislar va Retseptlar Dekoderi:** To'liq oflayn (internetsiz) ishlaydi.

            ### 📥 O'rnatish yo'riqnomasi:
            1. Quyidagi **MedLatin.apk** faylini yuklab oling.
            2. Telefoningizda faylni ochib, **"O'rnatish" (Установить)** tugmasini bosing.
            3. Agar telefoningiz xavfsizlik ruxsati so'rasa, *"Noma'lum manbalardan o'rnatishga ruxsat berish"* bandini yoqing.
          files: release-output/MedLatin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
